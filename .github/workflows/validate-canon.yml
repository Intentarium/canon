name: Validate canon

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run manifest
      - uses: actions/upload-artifact@v4
        with:
          name: canon-manifest
          path: dist/manifest.json
          if-no-files-found: error
          retention-days: 7
